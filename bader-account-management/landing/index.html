<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bader Account Management</title>
<link rel="icon" href="data:,">
<meta name="description" content="Bader Account Management — encrypted desktop vault for accounts, cards, documents and subscriptions.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<style>
:root{--p:#0ea5e9;--bg:#f5faff;--fg:#0f172a;--muted:#64748b;--card:#fff;--line:#dbeafe;--r:20px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Tajawal","Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.7}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--p);color:#fff;display:grid;place-items:center;font-style:normal}
nav.links{display:flex;gap:16px;margin-inline-start:auto;font-size:14px}
nav.links a{text-decoration:none;color:var(--muted)}
nav.links a:hover{color:var(--p)}
.lang{display:flex;gap:4px;background:#eef6ff;border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px;color:var(--muted)}
.lang button.on{background:var(--p);color:#fff}
.btn{display:inline-block;padding:13px 26px;border-radius:14px;background:var(--p);color:#fff;text-decoration:none;font-weight:700;border:0;cursor:pointer;font:inherit;font-weight:700;box-shadow:0 8px 20px -8px var(--p);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.hero{padding:80px 0 60px;text-align:center;background:radial-gradient(900px 400px at 50% -10%,color-mix(in srgb,var(--p) 18%,transparent),transparent 70%)}
.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.25;margin:0 auto 18px;max-width:850px}
.hero p{font-size:18px;color:var(--muted);max-width:720px;margin:0 auto 30px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.trust{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.trust span{background:#fff;border:1px solid var(--line);padding:7px 16px;border-radius:99px;font-size:13px;color:var(--muted)}
section{padding:64px 0}
h2{font-size:clamp(24px,3.4vw,36px);margin:0 0 10px;text-align:center}
.sub{color:var(--muted);text-align:center;max-width:680px;margin:0 auto 38px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:0 10px 30px -18px rgba(15,23,42,.25)}
.card .ic{font-size:30px}
.card h3{margin:8px 0 6px;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:15px}
.dark{background:#0b1220;color:#e2e8f0}
.dark .sub{color:#94a3b8}
.dark .card{background:#111c33;border-color:#1e2d4d;box-shadow:none}
.dark .card p{color:#94a3b8}
.ai{display:grid;gap:30px;grid-template-columns:1fr 1fr;align-items:center}
.ai ul{list-style:none;padding:0;margin:20px 0 0}
.ai li{padding:10px 0 10px 0;border-bottom:1px solid var(--line)}
.ai li::before{content:"✓";color:var(--p);font-weight:800;margin-inline-end:10px}
.mock{background:linear-gradient(160deg,#fff,#e6f4ff);border:1px solid var(--line);border-radius:28px;padding:30px;text-align:center;box-shadow:0 30px 60px -30px rgba(14,165,233,.5)}
.score{width:150px;height:150px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:conic-gradient(#16a34a 0 306deg,#e5e7eb 0)}
.score b{width:116px;height:116px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;color:#16a34a}
.price{max-width:460px;margin:0 auto;text-align:center;position:relative}
.badge{display:inline-block;background:#fef3c7;color:#92400e;padding:4px 14px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:10px}
.amount{font-size:58px;font-weight:800;line-height:1.1}
.old{color:var(--muted);text-decoration:line-through;font-size:20px;margin-inline-end:10px}
.per{color:var(--muted);margin-bottom:18px}
.price ul{list-style:none;padding:0;margin:0 0 24px;text-align:start}
.price li{padding:8px 0;border-bottom:1px solid var(--line)}
.price li::before{content:"✓";color:var(--p);font-weight:800;margin-inline-end:10px}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:0 auto 10px;max-width:760px}
summary{cursor:pointer;font-weight:700}
details p{color:var(--muted);margin:10px 0 0}
.contact{display:grid;gap:30px;grid-template-columns:1fr 1fr}
.crow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.crow span:first-child{color:var(--muted)}
form{display:grid;gap:10px}
input,textarea{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--p);border-color:transparent}
footer{padding:30px 0;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media(max-width:800px){nav.links{display:none}.ai,.contact{grid-template-columns:1fr}.nav{gap:10px}.lang{margin-inline-start:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a class="logo" href="#top"><i>b</i><span id="brandName"></span></a>
  <nav class="links" id="nav"></nav>
  <div class="lang" id="lang"></div>
</div></header>

<main id="top">
  <div class="hero"><div class="wrap">
    <h1 id="heroTitle"></h1><p id="heroText"></p>
    <div class="cta" id="heroCta"></div>
    <div class="trust" id="trust"></div>
  </div></div>

  <section id="features"><div class="wrap">
    <h2 id="featuresTitle"></h2><p class="sub" id="featuresSub"></p>
    <div class="grid" id="featuresGrid"></div>
  </div></section>

  <section id="security" class="dark"><div class="wrap">
    <h2 id="securityTitle"></h2><p class="sub">&nbsp;</p>
    <div class="grid" id="securityGrid"></div>
  </div></section>

  <section id="ai"><div class="wrap ai">
    <div><h2 id="aiTitle" style="text-align:start"></h2><p id="aiText" style="color:var(--muted)"></p><ul id="aiList"></ul></div>
    <div class="mock"><div class="score"><b>92</b></div><div style="font-weight:700">AI · Security score</div></div>
  </div></section>

  <section id="pricing" style="background:#fff"><div class="wrap">
    <h2 id="pricingTitle"></h2><p class="sub" id="pricingSub"></p>
    <div class="card price" id="priceCard"></div>
  </div></section>

  <section id="faq"><div class="wrap"><h2 id="faqTitle"></h2><p class="sub">&nbsp;</p><div id="faqList"></div></div></section>

  <section id="contact" style="background:#fff"><div class="wrap">
    <h2 id="contactTitle"></h2><p class="sub" id="contactSub"></p>
    <div class="contact"><div id="contactRows"></div>
      <form id="form"><h3 id="formTitle" style="margin:0"></h3>
        <input id="fName" required><input id="fEmail" type="email" required><textarea id="fMsg" rows="4" required></textarea>
        <button class="btn" type="submit" id="fSend"></button></form>
    </div>
  </div></section>
</main>
<footer><div class="wrap"><span id="foot"></span> <a id="privacy" hidden></a></div></footer>

<script src="site-config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
