<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>تفعيل الترخيص</title>
<style>:root{--ink:#0b2638;--ink2:#3e5a6e;--ink3:#6f8797;--blue:#1386dc;--mint:#12a27a;--coral:#e5484d;--glass:rgba(255,255,255,.66);--edge:rgba(255,255,255,.9);--line:rgba(11,38,56,.12)}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;color:var(--ink);
background:radial-gradient(700px 500px at 90% -5%,rgba(54,209,242,.35),transparent 62%),radial-gradient(700px 600px at 0% 110%,rgba(19,134,220,.22),transparent 62%),linear-gradient(180deg,#eef6fc,#e3eef8);background-attachment:fixed}
.card{width:100%;max-width:460px;padding:30px 28px 24px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--edge);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 30px 60px -32px rgba(15,76,117,.5)}
.head{text-align:center;margin-bottom:18px}.seal{width:118px;height:118px;transform:rotate(-8deg);mix-blend-mode:multiply}
h1{font-size:22px;margin:8px 0 4px}.app{color:var(--ink3);font-size:13px;margin:0}
.lead{color:var(--ink2);font-size:14.5px;line-height:1.7;margin:0 0 16px;text-align:center}
.msg{padding:11px 14px;border-radius:12px;font-size:14px;margin:0 0 14px;border:1px solid}
.msg.ok{background:rgba(18,162,122,.1);border-color:rgba(18,162,122,.3);color:#0b6b51}.msg.bad{background:rgba(229,72,77,.08);border-color:rgba(229,72,77,.3);color:#a3262a}
label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:600}
input[type=text]{width:100%;min-height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.85);font:inherit;font-size:17px;font-weight:600;letter-spacing:.1em;text-align:center;direction:ltr;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(19,134,220,.15)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:12px;border:0;border-radius:14px;font:inherit;font-size:15.5px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#0f6fc0,#1ba8e6);box-shadow:0 14px 28px -14px rgba(19,134,220,.9)}
.ghost{background:transparent;color:var(--ink2);box-shadow:none;border:1px solid var(--line);min-height:42px;font-size:14px}
.facts{margin:0 0 6px;padding:0}.facts div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.facts div:first-child{border-top:0}
.facts dt{color:var(--ink3)}.facts dd{margin:0;font-weight:600;text-align:end}
.stamp{display:inline-flex;flex-direction:column;align-items:center;margin:-6px auto 14px;padding:7px 16px;color:#1c7fd6;border:2px solid currentColor;outline:1px solid currentColor;outline-offset:-5px;border-radius:7px;transform:rotate(-6deg);font-weight:700;line-height:1.3}
.stamp small{font-size:12px;border-bottom:1px solid currentColor;padding-bottom:3px;margin-bottom:3px}.stamp i{font-style:normal;font-size:11.5px;letter-spacing:.12em}
.row{display:flex;gap:8px}.row form{flex:1}.foot{text-align:center;color:var(--ink3);font-size:12px;margin-top:16px}.foot a{color:var(--blue)}
.hide{display:none !important}
.dev{background:rgba(217,146,17,.1);border-color:rgba(217,146,17,.35);color:#7d5206}
.device{font-size:12px;color:var(--ink3);margin-top:10px;word-break:break-all}
.spin{opacity:.6;pointer-events:none}
</style>
</head>

    e.preventDefault();
    var btn = $('activateBtn'), code = $('code').value;
    btn.classList.add('spin'); btn.textContent = '…'; msg('');
    L.activate(code).then(function (res) {
      btn.classList.remove('spin'); btn.textContent = T.activate;
      msg(res.message, res.success);
      render(res.status);
      if (res.success) { setTimeout(function () { L.recheck(); }, 300); }
    });
  });
  $('recheckBtn').addEventListener('click', function () {
    var b = $('recheckBtn'); b.classList.add('spin');
    L.recheck().then(function (s) { b.classList.remove('spin'); render(s); msg(s.message, s.valid); });
  });
  $('continueBtn').addEventListener('click', function () {
    // Ask the main process to close this window and open the app
    L.recheck();
  });
})();
</script>
</body>
</html>
